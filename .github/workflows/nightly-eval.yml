# The answer-quality gate, run against a real local model every night.
#
# It needs a GPU and model weights, so it runs only on a self-hosted Windows runner
# labelled revia-gpu. With no such runner registered the job simply waits in the queue;
# it never touches the ordinary build-and-test workflow. docs/EVALUATION_GATE.md explains
# how to register the runner and how to update the baseline deliberately.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), all optional:
#   REVIA_EVAL_PORT               llama-server port the gate talks to (default 8080)
#   REVIA_EVAL_JUDGE_EXPERT_PORT  a second llama-server with the Expert model, used as the judge
#   REVIA_EVAL_HOME               a directory outside the checkout that keeps results and history
#   REVIA_LLAMA_SERVER            llama-server.exe to start when nothing answers on the port
#   REVIA_EVAL_MODEL              the .gguf model that server should load
name: Nightly answer-quality gate

on:
  schedule:
    # 03:17 UTC, off the hour so it does not queue behind everyone else's nightly jobs.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max_drop:
        description: 'Allowed overall pass-rate drop, in percentage points'
        required: false
        default: '3'
      no_judge:
        description: 'Run the deterministic checks only'
        type: boolean
        required: false
        default: false

# The gate only reads the repository and uploads its results as an artifact.
permissions:
  contents: read

# One model, one GPU: a second run would only compete with the first for both.
concurrency:
  group: nightly-answer-quality
  cancel-in-progress: false

jobs:
  gate:
    name: Golden set against the local model
    runs-on: [self-hosted, windows, revia-gpu]
    timeout-minutes: 240
    env:
      REVIA_EVAL_PORT: ${{ vars.REVIA_EVAL_PORT || '8080' }}
      REVIA_EVAL_JUDGE_EXPERT_PORT: ${{ vars.REVIA_EVAL_JUDGE_EXPERT_PORT }}
      REVIA_EVAL_HOME: ${{ vars.REVIA_EVAL_HOME }}
      REVIA_LLAMA_SERVER: ${{ vars.REVIA_LLAMA_SERVER }}
      REVIA_EVAL_MODEL: ${{ vars.REVIA_EVAL_MODEL }}
      # Inputs reach the scripts through the environment, never by text substitution.
      REVIA_EVAL_MAX_DROP: ${{ inputs.max_drop || '3' }}
      REVIA_EVAL_NO_JUDGE: ${{ inputs.no_judge || false }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the runner's toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in 'cmake', 'ninja', 'g++') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "The runner needs $tool on PATH. See docs/EVALUATION_GATE.md." }
          }
          & g++ -dumpfullversion

      - name: Configure
        run: cmake -S . -B build/eval -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DREVIA_BUILD_DESKTOP=OFF

      - name: Build the gate
        run: cmake --build build/eval --target ReviaAnswerGateLive

      - name: Make sure a model is answering
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $health = "http://127.0.0.1:$($env:REVIA_EVAL_PORT)/health"
          function Test-Model { try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 $health).StatusCode -eq 200 } catch { $false } }
          if (Test-Model) { Write-Host "A model is already answering on port $env:REVIA_EVAL_PORT."; exit 0 }
          if (-not $env:REVIA_LLAMA_SERVER -or -not $env:REVIA_EVAL_MODEL) {
            throw "Nothing answers on port $env:REVIA_EVAL_PORT and REVIA_LLAMA_SERVER / REVIA_EVAL_MODEL are not set."
          }
          $arguments = @('-m', $env:REVIA_EVAL_MODEL, '--host', '127.0.0.1', '--port', $env:REVIA_EVAL_PORT, '-c', '8192', '-ngl', '99')
          $server = Start-Process -FilePath $env:REVIA_LLAMA_SERVER -ArgumentList $arguments -PassThru -WindowStyle Hidden
          "REVIA_EVAL_SERVER_PID=$($server.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Test-Model)) {
            if ($server.HasExited) { throw "llama-server exited with code $($server.ExitCode)." }
            if ((Get-Date) -gt $deadline) { throw 'llama-server did not become healthy within ten minutes.' }
            Start-Sleep -Seconds 5
          }
          Write-Host "Started llama-server (process $($server.Id)) on port $env:REVIA_EVAL_PORT."

      - name: Run the answer-quality gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = if ($env:REVIA_EVAL_HOME) { Join-Path $env:REVIA_EVAL_HOME 'results' } else { 'RuntimeData/Evaluation' }
          $arguments = @('Config/Profiles/revia.json', 'Config/Evaluation/golden-set.jsonl', $env:REVIA_EVAL_PORT,
            '--output-dir', $output, '--commit', $env:GITHUB_SHA, '--max-drop', $env:REVIA_EVAL_MAX_DROP)
          if ($env:REVIA_EVAL_JUDGE_EXPERT_PORT) { $arguments += @('--judge-expert-port', $env:REVIA_EVAL_JUDGE_EXPERT_PORT) }
          if ($env:REVIA_EVAL_NO_JUDGE -eq 'true') { $arguments += '--no-judge' }
          $started = Get-Date
          & ./build/eval/ReviaAnswerGateLive.exe @arguments
          $code = $LASTEXITCODE
          # Stage this run's files inside the workspace so the artifact step can find them.
          $staging = 'build/eval-results'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Get-ChildItem -Path $output -File | Where-Object { $_.LastWriteTime -ge $started.AddSeconds(-5) -or $_.Name -eq 'history.jsonl' } |
            Copy-Item -Destination $staging
          exit $code

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: answer-quality-${{ github.run_id }}
          path: build/eval-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop the model this job started
        if: always() && env.REVIA_EVAL_SERVER_PID != ''
        shell: pwsh
        run: Stop-Process -Id $env:REVIA_EVAL_SERVER_PID -ErrorAction SilentlyContinue
