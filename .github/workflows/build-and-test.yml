# The checks that already exist locally, run on every push and pull request.
#
# The suites here are the ones a contributor can run themselves: a configure, a build,
# and the registered CTest tests. Nothing in this workflow needs a GPU, a model file, a
# llama-server, or a desktop session -- the opt-in live suites deliberately stay opt-in,
# because a job that fails when a model is absent teaches nobody anything.
#
# Qt is installed so the desktop shell and its smoke test are built and run too; that
# test is the one that catches a UI wiring break, and skipping it would leave the most
# user-visible target unverified.
name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the run still in flight. The older answer is
# about code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository. The token the steps can see should not be able
# to do more than that, because those steps run this repository's own code and tests.
permissions:
  contents: read

jobs:
  web-text:
    name: Public text relay and connector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Tools/Presence/WebDemo/package-lock.json
      - name: Test bounded public transport
        working-directory: Tools/Presence/WebDemo
        run: |
          echo "Testing commit $GITHUB_SHA"
          npm ci --ignore-scripts
          npm test

  web-operator-windows:
    name: Windows / WebDemo operator paths
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Tools/Presence/WebDemo/package-lock.json
      - name: Test real Windows script and config paths with spaces
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/operator-evidence | Out-Null
          git rev-parse HEAD | Set-Content build/operator-evidence/source-head.txt
          npm ci --prefix Tools/Presence/WebDemo --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:operator --prefix Tools/Presence/WebDemo 2>&1 | Tee-Object build/operator-evidence/operator.tap
          exit $LASTEXITCODE
      - name: Retain Windows operator result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-operator-${{ github.sha }}
          path: build/operator-evidence/
          if-no-files-found: error

  journal-linux:
    name: Linux / isolated journal persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test the production journal owner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/journal-evidence build/journal-deps
          git rev-parse HEAD | tee build/journal-evidence/source-head.txt
          g++ --version | tee build/journal-evidence/compiler.txt
          curl --fail --location --retry 2 https://github.com/nlohmann/json/releases/download/v3.11.3/json.tar.xz -o build/journal-deps/json.tar.xz
          tar -xf build/journal-deps/json.tar.xz -C build/journal-deps
          json_include=$(find build/journal-deps -path '*/include/nlohmann/json.hpp' -printf '%h\n' | head -n 1)
          test -n "$json_include"
          g++ -std=c++20 -O0 -DREVIA_JOURNAL_STANDALONE -IPublic -I"${json_include%/nlohmann}" \
            Tests/evidenceJournalTests.cpp Private/Audit/evidenceJournal.cpp \
            Private/Audit/actionAuditLogger.cpp Private/Audit/contentDigest.cpp \
            Private/Core/taskContract.cpp Private/Actions/actionTypes.cpp \
            -o build/journal-evidence/journal-tests 2>&1 | tee build/journal-evidence/build.log
          sha256sum build/journal-evidence/journal-tests | tee build/journal-evidence/binary.sha256
          build/journal-evidence/journal-tests read 2>&1 | tee build/journal-evidence/read.log
          build/journal-evidence/journal-tests all 2>&1 | tee build/journal-evidence/all.log
      - name: Retain Linux journal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-journal-${{ github.sha }}
          path: build/journal-evidence/
          if-no-files-found: error

  discord-voice:
    name: Discord voice / offline transport
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tools/Presence/DiscordVoice/package-lock.json
      - name: Install pinned voice transport
        working-directory: Tools/Presence/DiscordVoice
        run: npm ci --ignore-scripts --no-fund
      - name: Test synthetic audio and adapter lifecycle
        working-directory: Tools/Presence/DiscordVoice
        run: npm test

  windows:
    name: Windows / MinGW
    runs-on: windows-latest
    # A build that misses the compiler cache below is cold. A cold Debug build has grown from
    # about an hour to 100-125 minutes on a hosted runner, and a slow runner was cancelled at
    # 120 minutes seven steps before the end of the build. The limit leaves room for that and
    # the tests.
    timeout-minutes: 180
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      # The compiler comes out of the Qt tool cache, whose file times are not stable.
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record source identity and upload reserve
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/ci-evidence | Out-Null
          git rev-parse HEAD | Set-Content build/ci-evidence/source-head.txt
          git status --porcelain=v1 | Set-Content build/ci-evidence/source-status.txt
          "REVIA_CI_DEADLINE_UTC=$([DateTime]::UtcNow.AddMinutes(170).ToString('o'))" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the retrieval contract dependency
        run: python -m pip install --disable-pip-version-check numpy==2.2.6

      # Pinned to the toolchain the project is developed and tested with. MSVC is not a
      # supported configuration here: the build uses -static with MinGW and the tests
      # are calibrated against g++ 13.
      - name: Install Qt
        timeout-minutes: 15
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          cache: true

      - name: Select and verify Qt's MinGW 13.1 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtInstall = Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent
          $compilerBin = Join-Path $qtInstall 'Tools/mingw1310_64/bin'
          $compiler = Join-Path $compilerBin 'g++.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Missing compiler: $compiler" }
          $version = & $compiler -dumpfullversion
          if ($LASTEXITCODE -ne 0 -or $version -ne '13.1.0') { throw "Unexpected MinGW version: $version" }
          & $compiler --version | Tee-Object build/ci-evidence/compiler.txt
          "REVIA_COMPILER_BIN=$compilerBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # With the compile cache warm, GNU ld took nearly the whole build: about eighty
      # Debug executables, each pulling in the foundation library, six at a time on a
      # 16 GB runner. LLVM's lld links them about ten times faster in far less memory.
      # The image ships LLVM, and Qt's gcc runs the first ld.lld it finds on PATH. A
      # missing lld only makes the build slow again (CMake then keeps GNU ld), so this
      # warns instead of failing.
      - name: Find LLVM's lld linker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lld = (Get-Command ld.lld.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $lld) {
            $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
            if (Test-Path -LiteralPath (Join-Path $llvmBin 'ld.lld.exe')) {
              $lld = Join-Path $llvmBin 'ld.lld.exe'
              $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              # GITHUB_PATH prepends. Put the MinGW directory back in front of LLVM's so
              # its tools and runtime DLLs are still found first.
              $env:REVIA_COMPILER_BIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          if ($lld) { & $lld --version }
          if (-not $lld -or $LASTEXITCODE -ne 0) {
            Write-Output '::warning title=No lld::ld.lld was not found or does not run, so this build links with GNU ld and is much slower.'
            exit 0
          }

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401 # v5

      # A cold build spends most of its time compiling sources that have not changed since
      # the last run. ccache keeps those objects between runs. The release zip is pinned by
      # its SHA-256, checked against the maintainer's GPG signature when it was pinned.
      - name: Install ccache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -Uri 'https://github.com/ccache/ccache/releases/download/v4.11.3/ccache-4.11.3-windows-x86_64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'bfd031cad091b7db7e68c3303be542b0f7fee7a3e716d76ec6f7e6c7ef4b3526') { throw "Unexpected ccache archive: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP 'ccache-4.11.3-windows-x86_64'
          & (Join-Path $dir 'ccache.exe') --version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Job-level env cannot name the runner's temp folder, so the cache path is set here.
          "CCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'ccache')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Restored from the newest earlier run and saved under a new key after every build,
      # so the cache follows the code instead of freezing at its first contents. The g0
      # in the key matches the compile flags set at Configure: objects built with other
      # flags can never be hit, so a flag change starts an empty cache instead of
      # carrying dead entries in every restore and save.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-mingw1310-g0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ runner.os }}-mingw1310-g0-

      # FetchContent pulls cpp-httplib, nlohmann/json and the SQLite amalgamation on a
      # cold tree. Cached on the lockfile-equivalent -- the CMakeLists that names the
      # tags -- so an ordinary run does not re-download them.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/ci/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # Keep main's CI-only debug flags, compiler cache and lld path. The measured
      # driver and CMake pools bound compile/link concurrency independently.
      - name: Configure all native targets and complete inventory
        timeout-minutes: 5
        shell: pwsh
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS_DEBUG=-O0 -g0" "-DCMAKE_CXX_FLAGS_DEBUG=-O0 -g0" -DREVIA_USE_LLD=ON -DREVIA_COMPILE_JOBS=2 -DREVIA_LINK_JOBS=3 -DBUILD_TESTING=ON -DREVIA_REQUIRE_DESKTOP=ON "-DCMAKE_C_COMPILER=$env:REVIA_COMPILER_BIN/gcc.exe" "-DCMAKE_CXX_COMPILER=$env:REVIA_COMPILER_BIN/g++.exe" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "-DREVIA_QT_ROOT=$env:QT_ROOT_DIR" 2>&1 | Tee-Object build/ci-evidence/configure.log
          exit $LASTEXITCODE

      # CMake keeps GNU ld when Qt's gcc cannot run lld. Say so where it is seen.
      - name: Check which linker the build uses
        run: |
          if (Select-String -LiteralPath build/ci/build.ninja -SimpleMatch -Pattern '-fuse-ld=lld' -Quiet) {
            Write-Output 'Executables link with LLVM lld.'
          } else {
            Write-Output '::warning title=Slow links::CMake kept GNU ld (see the Configure step), so this build links slowly.'
          }

      - name: Build every target with measured bounded concurrency
        id: native_build
        timeout-minutes: 145
        shell: pwsh
        run: |
          ccache --zero-stats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remaining = ([DateTime]::Parse($env:REVIA_CI_DEADLINE_UTC) - [DateTime]::UtcNow).TotalSeconds - 1500
          if ($remaining -lt 1) { throw 'No build time remains after reserving relay, CTest and upload time.' }
          $budget = [int][Math]::Min(8700, $remaining)
          ./Tools/Build/InvokeMeasuredBuild.ps1 -BuildDirectory build/ci -Parallel 6 -TimeoutSeconds $budget -EvidenceDirectory build/ci-evidence/build
          exit $LASTEXITCODE

      # The console log cannot time a single link: ninja's output reaches it in buffered
      # bursts. Ninja's own log can, so list the slowest steps and the summed link time.
      - name: Show the slowest build steps
        if: always()
        continue-on-error: true
        run: |
          $log = 'build/ci/.ninja_log'
          if (-not (Test-Path -LiteralPath $log)) { exit 0 }
          $steps = Get-Content -LiteralPath $log | Where-Object { $_ -notmatch '^#' } | ForEach-Object {
            $fields = $_ -split "`t"
            [pscustomobject]@{ Seconds = ([long]$fields[1] - [long]$fields[0]) / 1000; Output = $fields[3] }
          }
          $links = @($steps | Where-Object Output -like '*.exe')
          'Linked {0} executables; their links took {1:N0} s added together.' -f $links.Count, ($links | Measure-Object Seconds -Sum).Sum
          $steps | Sort-Object Seconds -Descending | Select-Object -First 20 | Format-Table -AutoSize | Out-String -Width 240

      # Saved even when the build or a later step fails: the objects that did compile are
      # still good, and the next run should not have to compile them again.
      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-mingw1310-g0-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install pinned Live2D transport
        timeout-minutes: 3
        run: npm ci --prefix Tools/Presence/Live2D --ignore-scripts --no-audit --no-fund
      - name: Test relay through native public conversation with controlled loopback model
        timeout-minutes: 3
        shell: pwsh
        env:
          REVIA_WEB_NATIVE_HOST: ${{ github.workspace }}/build/ci/ReviaWebGuestHost.exe
        run: |
          npm ci --prefix Tools/Presence/WebDemo --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:native --prefix Tools/Presence/WebDemo 2>&1 | Tee-Object build/ci-evidence/native-relay.log
          exit $LASTEXITCODE
      - name: Check the complete CTest inventory and report optional video prerequisites
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          ./Tools/Build/InvokeCheckedCTest.ps1 -BuildDirectory build/ci -EvidenceDirectory build/ci-evidence/tests -AllowOptionalVideoPrerequisites
          exit $LASTEXITCODE
      - name: Retain source, build logs, resources, inventory and JUnit
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.sha }}
          include-hidden-files: true
          path: |
            build/ci-evidence/
            build/ci/Testing/
            build/ci/BuildDriverFixtures/
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: error

      # lld takes a symbol from any archive wherever it sits on the command line and
      # ignores --start-group, so it links some command lines that GNU ld rejects. GNU ld
      # is what Tools/Build.ps1, setup.bat and CLion link with unless the developer opts
      # in. Relinking a few executables with it here keeps a link-order mistake from
      # passing CI and then breaking those builds. Each one covers a different kind of link:
      # - R_E_V_I_A pulls in the foundation through revia_link_foundation.
      # - ReviaDesktopFixture is a -municode GUI program.
      # - ReviaArchiveWriterTests links SQLite by itself and --wraps two of its functions.
      # - ReviaProcessFixture links fully static.
      # ReviaTests, the largest link, is left out: on the runner GNU ld spent most of this
      # step's 7 minutes on it, and it adds no kind of link the four above do not cover.
      # The objects are already built, and reconfiguring only takes -fuse-ld=lld out of
      # the link commands, so ninja relinks these and compiles nothing. This runs after
      # Test, also when a test failed, so the tests above ran the lld build.
      - name: Link a few executables with GNU ld too
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          cmake -S . -B build/ci -DREVIA_USE_LLD=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -LiteralPath build/ci/build.ninja -SimpleMatch -Pattern '-fuse-ld=lld' -Quiet) {
            throw 'build.ninja still links with lld after configuring with REVIA_USE_LLD=OFF.'
          }
          cmake --build build/ci --target R_E_V_I_A ReviaDesktopFixture ReviaArchiveWriterTests ReviaProcessFixture
          exit $LASTEXITCODE

  # Cheap, fast, and catches the class of defect that has actually bitten this project:
  # a setup script that only works on the machine it was written on.
  scripts:
    name: Setup scripts / PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Windows PowerShell 5.1, not PowerShell 7, because that is what setup.bat
      # launches. The two differ in ways that have already broken a fresh install:
      # 5.1 runs on .NET Framework and does not load System.Net.Http for you.
      - name: Parse every script under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          $failed = $false
          Get-ChildItem -Path Tools -Filter *.ps1 -Recurse | ForEach-Object {
            $scriptPath = $_.FullName
            Write-Host "Parsing $scriptPath"
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath, [ref]$null, [ref]$errors) | Out-Null
            foreach ($parseError in $errors) {
              $failed = $true
              $extent = $parseError.Extent
              Write-Host ('{0}:{1}:{2}: {3}' -f $scriptPath, $extent.StartLineNumber, $extent.StartColumnNumber, $parseError.Message)
              Write-Host ("Source extent: " + $extent.Text)
              Write-Host "::error file=$scriptPath,line=$($extent.StartLineNumber),col=$($extent.StartColumnNumber)::$($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }

      # The assembly the model downloader needs must be loadable in the shell that
      # actually runs it. Constructing HttpClient without this threw "Unable to find
      # type" on a fresh machine, and a cached model set hid it.
      - name: Check the model downloader's runtime dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Net.Http -ErrorAction SilentlyContinue
          $client = [System.Net.Http.HttpClient]::new()
          $client.Dispose()
          Write-Host 'System.Net.Http is available to the downloader.'
